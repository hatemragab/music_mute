[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicmute-worker"
version = "0.0.0"
requires-python = ">=3.11"
description = "Shared MusicMute queue supervisor and native launcher contracts"
dependencies = []

[project.scripts]
musicmute-worker = "musicmute_worker.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["musicmute_worker*"]
