name: vocal_remover_mobile
description: Vocal Remover — Flutter Android client for Cloud Run vocal separation service.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  dio: ^5.4.0
  sqflite: ^2.3.0
  path: ^1.8.0
  file_picker: ^8.0.0
  just_audio: ^0.9.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
