  path: /worker/hints/socket
  method: GET
  protocol: WebSocket
  subprotocol: musicmute.worker-hint.v1
  authentication: Single-use 30-second ticket in Sec-WebSocket-Protocol; no bearer token, Origin, or URL query ticket.
  limits:
    maxClientMessageBytes: 1024
    maxSocketsPerMachine: 2
    maxSocketAgeSeconds: 3600
  messages: Server-to-worker advisory hints only. Any client message closes the connection.
  description: Direct HTTP upgrade outside Nest controller guards; separate IP, machine, service and connection budgets apply.
