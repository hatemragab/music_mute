openapi: 3.1.0
info:
  title: MusicMute HTTP API
  version: 0.1.0
  description: MusicMute HTTP contract for native apps, the administrator dashboard, public clients, and worker runtimes. This specification is versioned independently of the backend package. The worker hint WebSocket upgrade is outside Nest controllers and is described by x-websocket-upgrade.
  contact:
    name: MusicMute support
    url: https://github.com/hatemragab/music_mute/issues/new?template=bug_report.md
  x-audience:
    - public
    - native-app
    - administrator
    - worker-runtime
servers:
  - url: /
    description: Current origin
tags:
  - name: public
  - name: authentication
  - name: accounts
  - name: jobs
  - name: releases
  - name: admin
  - name: worker
paths:
  /media-imports:
    post:
      tags: [jobs]
      operationId: ImportsController.create
      summary: Import one supported native audio source
      description: Asynchronous native-audio acquisition through the private yt-dlp service into existing S3 processing. Requires existing processing access. Public single-item links from supported sites are evaluated without a fixed provider allowlist. Only separate audio streams are downloaded; no video acquisition, playlists, live streams, private-network access, or account cookies. A repeated request_id with the same canonical URL returns the same import; different input returns 409. Queue capacity includes active and waiting imports. Independently measured audio must satisfy account limits.
      security:
        - FirebaseBearer: []
      x-source: src/url-imports/imports.controller.ts
      x-auth-policy: U + processing access
      x-rate-policy: G overall + Ux processing-create
      parameters:
        - in: header
          name: X-Installation-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, request_id]
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                request_id: { type: string, format: uuid }
                trim_enabled:
                  {
                    type: boolean,
                    default: true,
                    description: Disable to retain the complete audio timeline.,
                  }
      responses:
        '202':
          description: Import admitted or previous admission returned. Processing completion is tracked through the existing job API after submission.
          headers:
            Location:
              schema: { type: string }
              description: Owner-scoped import status resource.
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaImportView' }
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          description: Invalid single-item source or unsupported provider/audio path.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          description: Import disabled, processing unavailable, or bounded import queue full. Queue-full code is IMPORT_QUEUE_FULL; retry later using the same request_id.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /media-imports/{id}:
    get:
      tags: [jobs]
      operationId: ImportsController.get
      summary: Read an owned URL import
      description: Status is retained for seven days after completion/failure. Responses are not cacheable. Unknown and foreign imports return 404. Post-admission errors are sanitized in the error field; submitted does not mean separation completed.
      security:
        - FirebaseBearer: []
      x-source: src/url-imports/imports.controller.ts
      x-auth-policy: U
      x-rate-policy: G overall + Ux processing-read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Current acquisition state.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaImportView' }
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
