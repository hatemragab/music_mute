components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: Firebase ID token. Owner routes additionally require a current local account; administrator routes require a matching active Google administrator record.
    WorkerCredential:
      type: http
      scheme: bearer
      description: Worker invitation, installation, or machine credential as specified per operation by x-worker-principal.
  schemas:
    MediaImportView:
      type: object
      required: [import_id, status, job_id, error, created_at, updated_at]
      properties:
        server_stage_timings:
          anyOf:
            - $ref: '#/components/schemas/ServerStageTimings'
            - type: 'null'
        import_id: { type: string, pattern: '^[a-f0-9]{24}$' }
        source_title:
          type: [string, 'null']
          maxLength: 200
          description: Original media title when available; also saved on the resulting job.
        status:
          type: string
          enum: [queued, downloading, validating, uploading, submitted, failed]
        job_id: { type: [string, 'null'] }
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApiError:
      type: object
      required:
        - status_code
        - message
      properties:
        status_code:
          type: integer
        code:
          type: string
        message:
          type: string
    AdminError:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
    EmptyBody:
      type: object
      maxProperties: 0
      additionalProperties: false
    AccountRecoveryRequestDto:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    AcknowledgeAdminAlertDto:
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          minimum: 0
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - expected_revision
        - operation_id
        - reason
    ActivateWorkerInstallationDto:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        expected_revision:
          type: integer
          minimum: 0
        credential_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
        - request_id
        - expected_revision
        - credential_digest
    AdminAccountRecoveryDecisionDto:
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          minimum: 0
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - expected_revision
        - operation_id
        - reason
    AdminJobActionDto:
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          minimum: 0
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - expected_revision
        - operation_id
        - reason
    AdminMediaGrantDto:
      type: object
      additionalProperties: false
      properties:
        asset:
          type: string
          enum:
            - input
            - result
        purpose:
          type: string
          enum:
            - play
            - download
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - asset
        - purpose
        - operation_id
        - reason
    AdminWorkerListQueryDto:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - pending
            - active
            - paused
            - draining
            - revoked
        group_id:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          type: string
          enum: &a2
            - darwin-arm64
            - windows-amd64
        release_version:
          type: string
          minLength: 1
          maxLength: 100
        cursor:
          type: string
          maxLength: 1024
          pattern: ^[A-Za-z0-9_-]+$
        limit:
          type: integer
          minimum: 1
          maximum: 100
    AppendInstallationLogsDto:
      type: object
      additionalProperties: false
      properties:
        sequence_start:
          type: integer
          minimum: 0
        sequence_end:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          maxLength: 1000
      required:
        - sequence_start
        - sequence_end
        - lines
    AppendRuntimeLogsDto:
      type: object
      additionalProperties: false
      properties:
        sequence_start:
          type: integer
          minimum: 0
        sequence_end:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          maxLength: 1000
        session_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        incarnation:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      required:
        - sequence_start
        - sequence_end
        - lines
        - session_id
        - incarnation
    ApplyWorkerConfigDto:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        incarnation:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        revision:
          type: integer
          minimum: 0
      required:
        - session_id
        - incarnation
        - request_id
        - revision
    ClaimWorkerJobDto:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        worker_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        session_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        incarnation:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        gpu_id:
          type: string
          minLength: 1
          maxLength: 128
        slot_index:
          type: integer
          minimum: 0
          maximum: 15
        applied_policy_revision:
          type: integer
          minimum: 0
      required:
        - request_id
        - worker_id
        - session_id
        - incarnation
        - gpu_id
        - slot_index
        - applied_policy_revision
    ClientErrorDto:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        operation_id:
          type: string
