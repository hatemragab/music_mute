name: Worker release checks

on:
  pull_request:
    paths:
      - "worker/**"
      - "backend/src/worker-fleet/protocol/**"
      - "tools/worker-gpu-feasibility/**"
      - ".github/workflows/worker-release-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked development dependencies
        run: |
          npm install --global pnpm@10.14.0
          pnpm install --frozen-lockfile --ignore-scripts
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r ../tools/worker-gpu-feasibility/requirements-mps-base.lock.txt
      - name: Install engine fixture media tools
        run: brew install ffmpeg
      - name: Verify source and engine fixtures
        run: pnpm run verify
      - name: Verify packed consumer and production Node dependencies
        run: |
          pnpm run test:package
          pnpm audit --prod
      # This workflow never publishes, contacts production, or qualifies a real GPU.
