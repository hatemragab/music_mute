<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>MusicMute audio preparation probe</title>
  <input id="audio" type="file" accept="audio/*" />
  <button id="prepare" type="button">Prepare selected audio</button>
  <p id="result" role="status">Choose a synthetic audio fixture.</p>
  <script type="module">
    import {
      inspectDuration,
      prepareAudio,
    } from "/src/home/audio-preparation.ts";
    document.querySelector("#prepare").addEventListener("click", async () => {
      const file = document.querySelector("#audio").files[0];
      if (!file) return;
      const result = document.querySelector("#result");
      result.textContent = "Preparing…";
      try {
        const signal = new AbortController().signal;
        const duration = await inspectDuration(file, signal);
        const prepared = await prepareAudio(file, duration, signal);
        const outputDuration = await inspectDuration(
          new File([prepared.blob], `prepared.${prepared.extension}`, {
            type: prepared.contentType,
          }),
          signal,
        );
        result.textContent = `${prepared.extension}; ${prepared.contentType}; ${prepared.blob.size} bytes; ${duration.toFixed(2)} seconds; output ${outputDuration.toFixed(2)} seconds`;
      } catch (error) {
        result.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</html>
