openapi: 3.1.0
info:
  title: MusicMute private yt-dlp audio acquisition
  version: 1.0.0
  x-audience: component-internal
  description: Native YouTube audio through one sticky proxy per attempt. Ten acquisitions overlap with at most two starts per rolling second. At most thirty seconds per attempt and 120 seconds across trusted attempts, including retry/admission waits. No video acquisition or FFmpeg. NestJS validates media and retains the existing private R2 and worker flow.
security:
  - service_key: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Process healthy; not paid provider availability proof.
  /audio-imports:
    post:
      parameters:
        - in: header
          name: X-Import-Request-ID
          required: false
          description: Internal execution UUID for log correlation; not idempotency. Invalid or absent values are replaced. Never forwarded to YouTube.
          schema: { type: string, format: uuid }
        - in: header
          name: X-Import-Attempt
          required: false
          description: Trusted ordinal; 1–3 Residential, 4 Mobile. The three attempt headers must be supplied together without duplicates. All absent means one execution without adapter retries.
          schema: { type: integer, minimum: 1, maximum: 4 }
        - in: header
          name: X-Import-Max-Attempts
          required: false
          description: Trusted persisted execution ceiling; ordinal must not exceed this value.
          schema: { type: integer, minimum: 1, maximum: 4 }
        - in: header
          name: X-Import-Acquisition-Started-At
          required: false
          description: Immutable first active acquisition claim. UTC ISO timestamp with exactly three fractional digits and Z. Future skew over five seconds is rejected. A timestamp over 120 seconds old is terminally exhausted before paid work.
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, max_bytes, max_duration_seconds]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Public single-item YouTube HTTPS watch, shorts, embed, live or youtu.be URL. Playlist-bearing watch URLs, channels, searches, other sites and live/upcoming media are rejected.
                max_bytes:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 100000000
                  description: Shared received-media-byte ceiling across format fallback within this attempt.
                max_duration_seconds:
                  type: number
                  format: double
                  exclusiveMinimum: 0
                  maximum: 1800
      responses:
        "200":
          description: Unchanged native audio; exact measured Content-Length, Cache-Control no-store, no redirect, compression, chunked transfer, video or processing.
          headers:
            Content-Length:
              description: Exact positive file byte count within max_bytes.
              schema: { type: integer, minimum: 1, maximum: 100000000 }
            X-Import-Extra-Data-Base64:
              description: Optional sanitized schema-version-1 base64 JSON, at most 4096 ASCII characters. Provider is yt-dlp; included title/channel/format/audio metadata only. No URLs, credentials, tokens or raw extractor payload. Missing or invalid means null. Metadata never replaces independent backend probing.
              schema: { type: string, maxLength: 4096 }
          content:
            audio/webm:
              schema: { type: string, format: binary }
            audio/mp4:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "413": { $ref: "#/components/responses/problem" }
        "415": { $ref: "#/components/responses/problem" }
        "422": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/problem" }
components:
  securitySchemes:
    service_key: { type: http, scheme: bearer }
  responses:
    problem:
      description: Sanitized stable IMPORT_* problem. Transient dependency/scratch failure is 503 with Retry-After 1, allowing only NestJS's existing bounded pre-upload retry policy. IMPORT_ACQUISITION_EXHAUSTED is terminal 503 without Retry-After. Permanent source/audio/size/duration failures are 422. No raw upstream text, secret or stack trace.
      headers:
        X-Import-Error:
          description: Same stable code as body.
          schema: { type: string }
        Retry-After:
          description: Present for eligible transient 503 only; never increases the trusted execution ceiling or deadline.
          schema: { type: integer, enum: [1] }
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: { type: string, const: "about:blank" }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
