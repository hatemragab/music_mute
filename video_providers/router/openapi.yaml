openapi: 3.1.0
info:
  title: MusicMute private audio acquisition router
  version: 1.0.0
  x-audience: component-internal
  description: >-
    Provider-neutral binary router. Selects one operator-configured private
    YouTube adapter (Tunelio by default, or explicitly qualified JoJAPI) and
    VideoScale for other enabled sites before exactly one POST, without retry,
    failover or redirects. The selected destination never changes after a failure.
    Twenty active relays share capacity across both routes; additional bounded
    handlers wait before submission. At most five submissions start per rolling second.
    NestJS independently validates audio and duration before R2 upload.
security:
  - service_key: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Process healthy; never an upstream availability check. Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /audio-imports:
    post:
      parameters:
        - in: header
          name: X-Import-Request-ID
          required: false
          description: Internal execution UUID propagated to the selected private adapter. Not an idempotency key. Invalid or absent values are replaced; never forwarded to a vendor.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, max_bytes, max_duration_seconds]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Qualified public HTTPS single-item URL. Exact YouTube hosts use the YouTube adapter; all other enabled catalog item shapes use the other-sites adapter. Playlists, profiles, credentials, ports, fragments and arbitrary destinations are rejected.
                max_bytes:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 100000000
                max_duration_seconds:
                  type: number
                  format: double
                  exclusiveMinimum: 0
                  maximum: 1800
      responses:
        "200":
          description: Streamed audio-only bytes with positive Content-Length from the selected private adapter; exact transfer count independently checked by NestJS. Cache-Control no-store. Invalid/truncated streaming closes the response. No redirects.
          headers:
            Content-Length:
              description: Measured adapter audio length, bounded by max_bytes.
              schema: { type: integer, minimum: 1, maximum: 100000000 }
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Import-Extra-Data-Base64:
              description: Optional sanitized schema-version-1 JSON metadata, base64 UTF-8, at most 4096 ASCII characters. Unknown fields, secrets and URLs removed. Invalid/absent metadata is nonfatal. Never trusted for size/duration admission.
              schema: { type: string, maxLength: 4096 }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            audio/webm:
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/mp4:
              schema: { type: string, format: binary }
            audio/ogg:
              schema: { type: string, format: binary }
            audio/opus:
              schema: { type: string, format: binary }
            application/ogg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "413": { $ref: "#/components/responses/problem" }
        "415": { $ref: "#/components/responses/problem" }
        "422": { $ref: "#/components/responses/problem" }
        "502": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/problem" }
components:
  securitySchemes:
    service_key: { type: http, scheme: bearer }
  responses:
    problem:
      description: Sanitized IMPORT_* problem JSON. Only known upstream code/status pairs preserved; raw bodies/headers never copied. 503 includes bounded Retry-After; it does not authorize an automatic POST retry. All responses have Cache-Control no-store.
      headers:
        X-Import-Error:
          description: Same stable IMPORT_* identifier as the problem body.
          schema: { type: string }
        Retry-After:
          description: Delay in seconds for 503, bounded to 86400. No automatic resubmission.
          schema: { type: integer, minimum: 0, maximum: 86400 }
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: { type: string, const: "about:blank" }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
