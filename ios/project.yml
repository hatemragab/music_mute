name: MusicMute
options:
  bundleIdPrefix: com.hatem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, ar, Base]
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.18.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.29.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VOCAL_LIVE_TEST: "0"
    MUSICMUTE_PRIVACY_URL: ""
    MUSICMUTE_ACCOUNT_DELETION_URL: ""
    MUSICMUTE_SENTRY_DSN: "https://9a0d643da9fac62aac592340e994a85d@o4506288965943296.ingest.us.sentry.io/4512142567800832"
  configs:
    Debug:
      MUSICMUTE_SENTRY_ENABLED: "NO"
      APS_ENVIRONMENT: development
      MUSICMUTE_API_BASE_URL: "http://127.0.0.1:3000"
    Release:
      MUSICMUTE_SENTRY_ENABLED: "YES"
      APS_ENVIRONMENT: production
      MUSICMUTE_API_BASE_URL: ""
targets:
  MusicMute:
    type: application
    platform: iOS
    sources: [Vocal]
    dependencies:
      - package: Sentry
        product: Sentry
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatem.musicmute
        PRODUCT_MODULE_NAME: Vocal
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Vocal/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vocal/Vocal.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  VocalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VocalTests]
    dependencies:
      - target: MusicMute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hatem.musicmute.tests
  VocalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VocalUITests]
    dependencies:
      - target: MusicMute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hatem.musicmute.uitests
schemes:
  MusicMute:
    build:
      targets:
        MusicMute: all
    test:
      gatherCoverageData: true
      environmentVariables:
        VOCAL_LIVE_TEST: "$(VOCAL_LIVE_TEST)"
      targets:
        - VocalTests
        - VocalUITests
    run:
      config: Debug
